<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heimweg</title>
<meta name="description" content="U2 from Theresienstraße that catch the S1 to Lohhof at Feldmoching">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heimweg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7; --bad: #b91c1c; --bad-bg: #fee2e2;
    --accent-bg: #dbeafe; --u: #0065ae; --s: #408335;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --card: #131c2e; --text: #e5e7eb; --muted: #94a3b8; --line: #1f2a40;
      --ok: #4ade80; --ok-bg: #12301f; --warn: #fbbf24; --warn-bg: #3a2c0b; --bad: #f87171; --bad-bg: #3b1414;
      --accent-bg: #172554;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  button { font: inherit; border: 0; border-radius: 12px; cursor: pointer; background: var(--card); color: var(--text);
    box-shadow: 0 0 0 1px var(--line) inset; width: 44px; height: 44px; font-size: 20px; }
  button:active { transform: scale(0.97); }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: 0 0 0 1px var(--line) inset; margin-bottom: 12px; }
  .hero.ok { background: var(--ok-bg); box-shadow: none; }
  .hero.warn { background: var(--warn-bg); box-shadow: none; }
  .hero.bad { background: var(--bad-bg); box-shadow: none; }
  .hero.none { background: var(--accent-bg); box-shadow: none; }
  .hero .k { font-size: 13px; color: var(--muted); }
  .hero .big { font-size: 26px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -0.01em; }
  .hero .state { font-weight: 600; }
  .ok .state { color: var(--ok); } .warn .state { color: var(--warn); } .bad .state { color: var(--bad); }
  .chip { display: inline-block; color: #fff; font-weight: 700; font-size: 12px; border-radius: 6px; padding: 2px 6px; margin-right: 6px; }
  .chip.s { background: var(--s); } .chip.u { background: var(--u); }
  .s1 { display: flex; align-items: center; gap: 8px; }
  .s1 .t { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .s1 .t s { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 4px; }
  .s1 .dest { flex: 1; min-width: 0; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .b-ok { color: var(--ok); background: var(--ok-bg); } .b-warn { color: var(--warn); background: var(--warn-bg); }
  .b-bad { color: var(--bad); background: var(--bad-bg); }
  .u2 { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; padding: 9px 0 0; margin-top: 9px;
    border-top: 1px solid var(--line); font-size: 15px; }
  .u2 b { font-variant-numeric: tabular-nums; }
  .u2 .m { color: var(--muted); font-size: 13px; }
  .u2 .in { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .u2.tight .m .chg { color: var(--warn); font-weight: 600; }
  .late { color: var(--warn); font-weight: 600; }
  .card.cancelled .s1 .t { text-decoration: line-through; color: var(--muted); }
  .empty, .err { color: var(--muted); }
  .err { color: var(--bad); }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Heimweg</h1>
      <div class="sub" id="updated">Loading …</div>
    </div>
    <button id="refresh" aria-label="Refresh">↻</button>
  </header>
  <div class="card hero none" id="hero">
    <div class="k" id="hero-k">Theresienstraße → Feldmoching → Lohhof</div>
    <div class="big" id="hero-big">–</div>
    <div class="state" id="hero-state"></div>
  </div>
  <div id="groups"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
// Liam's way home: U2 Theresienstraße -> Feldmoching, then S1 towards Lohhof.
// For each upcoming S1 (live departure time) the two latest U2 that still catch it.
const RELAY = "https://zug-relay.liam-galetzki0.workers.dev";
const S1_STOP = "de:09162:320";            // Feldmoching
const U2_STOP = "de:09162:120";            // Theresienstraße
const NORTH = /freising|flughafen|airport|neufahrn|unterschlei|lohhof/i;   // S1 heading past Lohhof
const MIN_CHANGE = 1;                      // minutes from U2 arrival to S1 departure at Feldmoching
const FALLBACK_TRAVEL = 16;                // U2 Theresienstraße -> Feldmoching, if the journey planner has nothing
const PER_S1 = 2, MAX_S1 = 4, DELAY_WARN = 5;

const $ = (id) => document.getElementById(id);
const MIN = 60000;
const norm = (s) => String(s || "").replace(/\s+/g, "").toUpperCase();
const hm = (d) => d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function relay(query) {
  const r = await fetch(RELAY + "/?" + query, { cache: "no-store" });
  if (!r.ok) throw new Error("MVV " + r.status);
  return r.json();
}
function events(data) {
  return (data.stopEvents || []).map((e) => {
    const tr = e.transportation || {}, props = (e.location && e.location.properties) || {};
    const planned = new Date(e.departureTimePlanned);
    const est = e.departureTimeEstimated ? new Date(e.departureTimeEstimated) : planned;
    return { line: norm(tr.number || tr.disassembledName), dest: (tr.destination && tr.destination.name) || "",
             planned, est, delay: Math.max(0, Math.round((est - planned) / MIN)), realtime: !!e.departureTimeEstimated,
             cancelled: !!e.isCancelled, platform: props.platformName || props.platform || "" };
  }).filter((d) => !isNaN(d.planned));
}
// U2 arrival times at Feldmoching from the journey planner: { plannedDepartureMs: arrivalDate }, plus typical travel time
function u2Arrivals(trips) {
  const byDep = new Map(), travel = [];
  for (const j of (trips && trips.journeys) || []) {
    const ride = j.legs.filter((l) => l.productClass != null && l.productClass < 90);   // drop footpaths
    if (ride.length !== 1 || norm(ride[0].number) !== "U2") continue;
    const l = ride[0], dep = new Date(l.departurePlanned), arrP = new Date(l.arrivalPlanned);
    byDep.set(dep.getTime(), l.arrivalEstimated ? new Date(l.arrivalEstimated) : arrP);
    travel.push(Math.round((arrP - dep) / MIN));
  }
  travel.sort((a, b) => a - b);
  return { byDep, travel: travel.length ? travel[travel.length >> 1] : null };
}

// The Freising and Flughafen parts run joined until Neufahrn (after Lohhof): one train per planned time.
// Only cancelled if both parts are; otherwise the earliest running part counts.
function joinParts(list) {
  const byTime = new Map();
  for (const d of list) {
    const k = d.planned.getTime(), g = byTime.get(k);
    if (!g) { byTime.set(k, { ...d, dests: [d.dest] }); continue; }
    if (!g.dests.includes(d.dest)) g.dests.push(d.dest);
    const run = [g, d].filter((x) => !x.cancelled).sort((a, b) => a.est - b.est)[0];
    if (run) Object.assign(g, { est: run.est, delay: run.delay, realtime: g.realtime || d.realtime, cancelled: false,
                                platform: g.platform || d.platform });
  }
  return [...byTime.values()].map((g) => ({ ...g, dest: g.dests.map((x) => x.replace(/\s*München\s*/g, " ").trim()).join(" + ") }))
                             .sort((a, b) => a.est - b.est);
}

function plan(s1Data, u2Data, trips, now) {
  const arr = u2Arrivals(trips), travel = arr.travel || FALLBACK_TRAVEL;
  const s1s = joinParts(events(s1Data).filter((d) => d.line === "S1" && NORTH.test(d.dest) && d.est >= now - 30000));
  const u2All = events(u2Data).filter((d) => d.line === "U2" && /feldmoching/i.test(d.dest) && !d.cancelled);
  const horizon = Math.max(0, ...u2All.map((u) => u.planned.getTime()));
  const u2s = u2All.filter((u) => u.est >= now - 30000).map((u) => {
    const known = arr.byDep.get(u.planned.getTime());
    return { ...u, arr: known || new Date(u.est.getTime() + travel * MIN), exact: !!known };
  });
  const groups = [];
  for (const s of s1s) {
    if (groups.length >= MAX_S1) break;
    if (s.est.getTime() - (travel + MIN_CHANGE) * MIN > horizon) break;   // U2 data doesn't reach that far yet
    if (s.cancelled) { groups.push({ s1: s, u2: [] }); continue; }
    const catches = u2s.filter((u) => u.arr.getTime() + MIN_CHANGE * MIN <= s.est.getTime())
                       .sort((a, b) => b.est - a.est).slice(0, PER_S1);
    if (catches.length) groups.push({ s1: s, u2: catches });
  }
  return { groups, travel, fromPlanner: !!arr.travel, anyS1: s1s.length > 0 };
}

function s1Badge(s) {
  if (s.cancelled) return '<span class="badge b-bad">cancelled</span>';
  if (s.delay >= DELAY_WARN) return `<span class="badge b-warn">+${s.delay} min</span>`;
  if (s.delay > 0) return `<span class="badge b-ok">+${s.delay} min</span>`;
  return `<span class="badge b-ok">${s.realtime ? "on time" : "scheduled"}</span>`;
}
const until = (d, now) => { const m = Math.round((d - now) / MIN); return m <= 0 ? "now" : "in " + m + " min"; };

function render(p, now) {
  const hero = $("hero");
  const first = p.groups.find((g) => g.u2.length);
  const cancelled = p.groups.filter((g) => g.s1.cancelled);
  if (!first) {
    hero.className = "card hero " + (cancelled.length ? "bad" : "none");
    $("hero-big").textContent = p.anyS1 ? "No connection right now" : "No S1 to Lohhof soon";
    $("hero-state").textContent = cancelled.length ? "S1 " + hm(cancelled[0].s1.planned) + " cancelled · check the MVV app" : "Check the MVV app";
  } else {
    const u = first.u2[0], s = first.s1;
    hero.className = "card hero " + (cancelled.length && cancelled[0].s1.est < s.est ? "bad" : s.delay >= DELAY_WARN ? "warn" : "ok");
    $("hero-big").textContent = "U2 " + hm(u.est) + " → S1 " + hm(s.est);
    $("hero-state").textContent = "Leave Theresienstraße " + until(u.est, now)
      + (cancelled.length && cancelled[0].s1.est < s.est ? " · S1 " + hm(cancelled[0].s1.planned) + " cancelled" : "")
      + (s.delay ? " · S1 +" + s.delay : "");
  }
  $("groups").innerHTML = p.groups.map((g) => {
    const s = g.s1;
    const time = s.delay && !s.cancelled ? `${hm(s.est)}<s>${hm(s.planned)}</s>` : hm(s.planned);
    const head = `<div class="s1"><span class="chip s">S1</span><span class="t">${time}</span>
      <span class="dest">${esc(s.dest)}${s.platform ? " · Gl. " + esc(s.platform) : ""}</span>${s1Badge(s)}</div>`;
    const rows = g.u2.map((u) => {
      const change = Math.round((s.est - u.arr) / MIN);
      return `<div class="u2${change <= 2 ? " tight" : ""}"><span class="chip u">U2</span>
        <span><b>${hm(u.est)}</b>${u.delay ? ` <span class="late">+${u.delay}</span>` : ""}
          <span class="m">→ ${u.exact ? "" : "≈"}${hm(u.arr)} · <span class="chg">${change} min change</span></span></span>
        <span class="in">${until(u.est, now)}</span></div>`;
    }).join("");
    return `<div class="card${s.cancelled ? " cancelled" : ""}">${head}${rows}</div>`;
  }).join("") || '<div class="card empty">No S1 towards Lohhof with a U2 connection in the next hour.</div>';
  $("updated").textContent = "Updated " + hm(now) + " · refreshes every minute";
  $("foot").textContent = "Data: MVV · change at Feldmoching ≥ " + MIN_CHANGE + " min · U2 ride "
    + (p.fromPlanner ? p.travel + " min" : "≈" + p.travel + " min (estimate)");
}

let busy = false;
async function refresh() {
  if (busy) return; busy = true; $("refresh").textContent = "…";
  try {
    const [s1, u2, trips] = await Promise.all([relay("stop=" + S1_STOP), relay("stop=" + U2_STOP),
                                              relay("trip=u2").catch(() => null)]);
    const now = new Date();
    render(plan(s1, u2, trips, now.getTime()), now);
  } catch (e) {
    $("hero").className = "card hero bad"; $("hero-big").textContent = "No live data";
    $("hero-state").textContent = "Try ↻ again or use the MVV app";
    $("groups").innerHTML = '<div class="card err">Could not load departures.<br><small>' + esc(e.message) + "</small></div>";
    $("updated").textContent = "Error while loading";
  } finally { busy = false; $("refresh").textContent = "↻"; }
}
$("refresh").addEventListener("click", refresh);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(refresh, 60000);
refresh();
</script>
</body>
</html>
